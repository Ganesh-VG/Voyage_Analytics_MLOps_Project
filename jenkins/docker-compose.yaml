version: "3.8"

services:

  jenkins:
    build: .

    container_name: voyage_jenkins

    restart: unless-stopped

    user: root

    ports:
      - "8081:8080"
      - "50000:50000"

    working_dir: /workspace

    volumes:

      # Jenkins data
      - jenkins_home:/var/jenkins_home

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock

      # Jenkins CI/CD Workspace
      - ../shared-workspace:/workspace

      # Project-local kubeconfig generated by init-minikube.sh
      - ./kube:/root/.kube

volumes:

  jenkins_home: