version: "3.8"

services:

  jenkins:

    build: .

    container_name: voyage_jenkins

    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    user: root

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/workspace

volumes:

  jenkins_home: