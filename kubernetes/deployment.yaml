apiVersion: apps/v1
kind: Deployment

metadata:
  name: voyage-api
  namespace: voyage-analytics

spec:
  replicas: 2

  selector:
    matchLabels:
      app: voyage-api

  template:

    metadata:
      labels:
        app: voyage-api

    spec:

      containers:

      - name: voyage-api

        image: voyage-api:${API_IMAGE_TAG}

        imagePullPolicy: Never

        ports:

        - containerPort: 8000

        envFrom:

        - configMapRef:
            name: voyage-api-config

        resources:

          requests:
            memory: "512Mi"
            cpu: "500m"

          limits:
            memory: "1Gi"
            cpu: "1000m"

        readinessProbe:

          httpGet:
            path: /
            port: 8000

          initialDelaySeconds: 15
          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /
            port: 8000

          initialDelaySeconds: 30
          periodSeconds: 15