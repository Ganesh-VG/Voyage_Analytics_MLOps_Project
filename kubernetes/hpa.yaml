apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: voyage-api-hpa
  namespace: voyage-analytics

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voyage-api

  minReplicas: 2
  maxReplicas: 5

  metrics:

  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 70