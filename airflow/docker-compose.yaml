version: "3.8"

services:

  postgres:

    image: postgres:15

    container_name: airflow_postgres

    restart: always

    environment:

      POSTGRES_USER: airflow

      POSTGRES_PASSWORD: airflow

      POSTGRES_DB: airflow

    volumes:

      - postgres-db-volume:/var/lib/postgresql/data


  mlflow:

    build: .

    container_name: voyage_mlflow

    user: root

    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /mlflow/mlflow.db ] && [ -f /seed/mlflow.db ]; then
          cp -a /seed/. /mlflow/
        fi
        mkdir -p /mlflow/artifacts
        exec mlflow server \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --artifacts-destination file:///mlflow/artifacts \
          --host 0.0.0.0 \
          --port 5000

    ports:

      - "5000:5000"

    volumes:

      # Persistent MLflow tracking database and artifacts.
      - mlflow-data:/mlflow

      # Makes artifacts from the project's earlier Airflow-based runs readable.
      - mlflow-data:/opt/airflow/mlflow

      # One-time seed source for existing local MLflow history, if present.
      - ../mlflow:/seed:ro

    restart: always


  airflow-init:

    build: .

    container_name: airflow_init

    user: root

    depends_on:

      - postgres

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      PROJECT_ROOT: /workspace

      _AIRFLOW_WWW_USER_USERNAME: admin

      _AIRFLOW_WWW_USER_PASSWORD: admin

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Ganesh
      --lastname Gouda
      --role Admin
      --email admin@example.com
      --password admin
      "

    volumes:

      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

      # Shared project workspace
      - C:/Projects/JenkinsWorkspace/Voyage_Analytics_MLOps:/workspace


  airflow-webserver:

    build: .

    container_name: airflow_webserver

    user: root

    depends_on:

      airflow-init:

        condition: service_completed_successfully

      mlflow:

        condition: service_started

    ports:

      - "8080:8080"

    command: webserver

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      PROJECT_ROOT: /workspace

      MLFLOW_TRACKING_URI: http://mlflow:5000

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth

    volumes:

      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

      # Shared project workspace
      - C:/Projects/JenkinsWorkspace/Voyage_Analytics_MLOps:/workspace

    restart: always


  airflow-scheduler:

    build: .

    container_name: airflow_scheduler

    user: root

    depends_on:

      airflow-init:

        condition: service_completed_successfully

      mlflow:

        condition: service_started

    command: scheduler

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      PROJECT_ROOT: /workspace

      MLFLOW_TRACKING_URI: http://mlflow:5000

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth

    volumes:

      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

      # Shared project workspace
      - C:/Projects/JenkinsWorkspace/Voyage_Analytics_MLOps:/workspace

    restart: always


volumes:

  postgres-db-volume:

  mlflow-data:
